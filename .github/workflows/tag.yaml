# Cuts a release of this repository
#
# Run it from the Actions tab, on main, with the version as 1.2.3.  The
# commit it runs on is tagged v1.2.3 and published as a GitHub release,
# so a caller can pin the tag, or the commit it names, instead of
# tracking @main.
#
# The workflows reach this repository's own actions through `$/`
# references, which GitHub resolves to the repository of the file that
# holds them, at the commit that is running.  A caller on ci.yaml@v1.2.3
# therefore runs this repository's actions from the tagged commit, so
# the tag can sit on main as it stands.  A reference that names this
# repository with a ref of its own would run that ref instead, and the
# release refuses one.
#
# A caller pinning the tag relies on it staying put.  Release
# immutability, a repository setting under Settings → General →
# Releases, locks the tag of every release published while it is on.  No
# token here can read that setting, so the last step reads the release
# instead and fails one that came out mutable.
#
# Every job sets `timeout-minutes: 60` — see ci.yaml for why.

on:
  workflow_dispatch:
    inputs:

      version:
        description: >
          Version to release, as 1.2.3.  The tag is v1.2.3.
        type: string
        required: true

name: tag

# Tags the commit and publishes the release.
permissions:
  contents: write

jobs:

  tag:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v5

      # A release cut from any other branch would ship unmerged code, and
      # an existing tag would be published as it is, wherever it points.
      - name: Check inputs
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this on main, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version like 1.2.3, got '$VERSION'."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists."
            exit 1
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      # Comments are left out: the usage examples in the workflow headers
      # name blockr.ci the way a caller does.
      - name: Check this repository's own references
        run: |
          if git grep -niE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^#[:space:]]*blockr\.ci/' -- .github; then
            echo '::error::Write these references as $/<path>, so that they follow the tag.'
            exit 1
          fi

      - name: Publish the release
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes

      - name: Check the release is immutable
        run: |
          immutable=$(gh release view "$TAG" --json isImmutable --jq .isImmutable)
          if [ "$immutable" != true ]; then
            echo "::error::$TAG came out mutable, so its tag can still be moved. Enable release immutability under Settings → General → Releases, delete the release and the tag, and run this again."
            exit 1
          fi
