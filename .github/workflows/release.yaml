# CRAN pre-submission checks for blockr.* packages
#
# The ci.yaml `check` matrix covers what GitHub's runners offer: macOS,
# Windows and Linux on release / devel / oldrel.  CRAN also runs
# AddressSanitizer, UndefinedBehaviorSanitizer, valgrind, a no-long-double
# build, a Suggests-free build and `rchk`.  For a package with compiled
# code those are where a submission gets rejected, and without this
# workflow the first signal is CRAN's own check page, after the upload.
#
# The flavours come from R-hub, in two shapes.  Most are public
# containers pulled straight from ghcr.io and run under `container:`;
# the rest — `m1-san`, `windows`, `macos`, `macos-arm64` — are virtual
# machines and run on a GitHub runner directly.  Both shapes are
# resolved by `r-hub/actions/setup`, so neither needs an R-hub account
# nor the `rhub` package.
#
# Usage — consumer repo .github/workflows/release.yaml, a file of its
# own rather than a second jobs: entry in ci.yaml:
#
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize, labeled]
#     merge_group:
#
#   name: release
#
#   jobs:
#     release:
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/release.yaml@main
#       with:
#         release-platforms: |
#           clang-asan
#           gcc-asan
#           clang-ubsan
#           m1-san
#           valgrind
#           rchk
#           nosuggests
#       secrets:
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#
# Pass secrets by name: `secrets: inherit` does not forward secrets
# across organisations — the inherited values silently arrive blank in
# the called job.
#
# A separate consumer-side file, rather than an entry in ci.yaml, for
# two reasons.  Adding `labeled` to ci.yaml's `on:` block would re-run
# all of ci on every label change on every pull request, and a jobs:
# entry there would report as `ci / …` instead of keeping the context at
# `release / release-all`.
#
# ── Why the caller carries no `if:` ──────────────────────────────────
#
# Per #52, gating the *caller* job removes the nested contexts entirely:
# a skipped caller produces one check run named `release` and nothing
# below it, so a required `release / release-all` would sit at
# "Expected — waiting for status" and block every merge.  An absent
# context is not a skipped one.  So the caller runs on every event and
# only the inner jobs are conditional, which leaves `release-all` free
# to report on every ref.
#
# ── Trigger: a label on the release-prep pull request ────────────────
#
# The pull request is the commit being submitted, so it is the thing
# worth checking; a release tracking *issue* has no commit to report a
# status against and could not back a required check at all.
#
# The label marks the pull request as a release candidate — a mode, not
# a one-shot "run now" button.  The condition is therefore that the
# label is *present*, which holds on every subsequent push, and the
# `labeled` type in the caller's `on:` block exists so that applying the
# label starts a run on a branch that is already pushed.
#
# Running on each push is the point rather than a cost.  The tarball is
# built from a commit on this pull request, before it merges, so every
# push produces a new release candidate; checking only the commit that
# happened to be current when the label went on would leave the
# submitted one unchecked.  That also keeps `release-all` an honest
# gate: it is green for the head commit because the flavours passed on
# it, not because nothing ran.
#
# ── Why `merge_group` passes through ─────────────────────────────────
#
# This workflow is the mirror image of revdep.yaml.  Reverse
# dependencies do the real work on `merge_group` and pass through on the
# pull-request ref; release checks do the real work on the pull-request
# ref and pass through on `merge_group`.  A label-gated condition
# produces nothing on a `merge_group` ref — there is no pull request and
# no label there — so the real work could not run at the queue even in
# principle, and a required context that is never created burns the
# queue's `check_response_timeout_minutes` instead of merging.
#
# Passing through costs nothing.  The point of these checks is to read
# sanitizer and valgrind results before submitting, which happens on the
# pull request; re-running them at merge time would pay twice for the
# same answer.
#
# Note the traffic is one-way: this workflow steps aside at the queue,
# but ci.yaml's check matrix and revdep.yaml both still run there for a
# release pull request, exactly as for any other.  They gate the merge
# commit rather than the submission, and skipping them would reopen the
# red-main gap the queue exists to close.
#
# ── Reverse dependencies ─────────────────────────────────────────────
#
# A release wants to know whether it breaks what CRAN currently ships,
# while revdep.yaml installs each downstream from its GitHub branch and
# answers the development-state question instead.  The CRAN-shaped
# answer is r-devel/recheck, called below when `recheck-which` is set.
# The two coexist rather than replacing one another: recheck answers for
# the submission, on the pull-request ref, and revdep.yaml keeps
# answering for the merge, at the queue.  Upstream rules recheck out as
# a gate — the results turn on unrelated failures in other people's
# packages — so it is read by a human rather than required, and stays
# outside `release-all`.
#
# Each container manages its own toolchain and setup-deps installs no
# Quarto, so a consumer whose vignettes are .qmd rather than .Rmd fails
# the vignette build on every flavour that does not already pass
# --no-build-vignettes.  That is why no QUARTO_VERSION appears here.
#
# Every job here sets `timeout-minutes` — see ci.yaml for the reasoning.
# The check jobs are the fleet's one deviation from the shared hour:
# valgrind runs a test suite tens of times slower than native, and rchk
# and the sanitizers all pay for an instrumented build from source, so
# an hour sits close to legitimate runtime rather than far above it.

on:
  workflow_call:
    inputs:

      release-platforms:
        description: >
          Newline-separated list of R-hub platforms to check in, named as
          R-hub names them (e.g. `clang-asan`, `valgrind`, `rchk`,
          `nosuggests`, `m1-san`).  Commas work too.  Both the container
          flavours and the virtual-machine ones are available; see the
          R-hub platform list for what a name resolves to, and the README
          for which flavours a package's properties call for.  Empty, the
          default, skips the matrix and reports success, so a consumer
          can wire the caller in and choose a list later.
        type: string
        default: ''
        required: false

      recheck-which:
        description: >
          Run a CRAN-style reverse dependency check via r-devel/recheck,
          over this many downstream packages: `strong` (Depends, Imports,
          LinkingTo) or `most` (those plus Suggests).  Empty, the default,
          skips it -- which is also the right setting for a first release,
          where nothing on CRAN depends on the package yet.
        type: string
        default: ''
        required: false

    secrets:

      BLOCKR_PAT:
        description: >
          PAT used for authenticated GitHub API calls in dependency
          resolution, and for reaching packages named in Remotes that
          live in private repositories.  Falls back to github.token when
          not provided.
        required: false

name: release

jobs:

  # ── Resolve release-platforms into the two R-hub matrices ───────────
  #
  # The `r-hub/actions/setup` action matches each name against R-hub's
  # own platform list and emits one matrix per shape: `containers` for
  # the flavours that are docker images, `platforms` for the ones that
  # are virtual machines.  Building the matrix here instead, by mapping
  # each name onto `ghcr.io/r-hub/containers/<name>:latest`, is what this
  # job used to do, and it structurally could not reach the second group.
  # That is #56: there is no container image for `m1-san`, the ASAN and
  # UBSAN build on macOS ARM, so a sanitizer finding that only reproduces
  # on Apple silicon stayed invisible to this workflow.
  #
  # Two secondary gains.  The name-to-image mapping stops being ours to
  # maintain when R-hub adds or renames an image, and an unknown name is
  # rejected against the real list — by name, in seconds — rather than
  # failing later and opaquely on an image pull.  So no hand-rolled
  # validation remains here.
  #
  # Each matrix entry carries a `job-config` blob that the r-hub/actions
  # steps below take as an input.  Passing it is not decoration.  R-hub
  # attaches `pre-check` scripts to some platforms, and `run-check` reads
  # them from exactly that blob: valgrind picks up a package's
  # tools/valgrind.supp there, and the whole sanitizer toolchain on
  # `m1-san` is installed by one.  Omitting it on the latter would check
  # an ordinary macOS build under a name promising sanitizers.

  matrix:

    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    timeout-minutes: 60

    outputs:
      containers: ${{ steps.setup.outputs.containers || '[]' }}
      platforms: ${{ steps.setup.outputs.platforms || '[]' }}

    steps:

      # The action takes one comma-separated string, while the input is
      # documented as newline-separated, so both separators are accepted
      # and normalised to the one it wants.
      - name: Normalise the platform list
        id: parse
        env:
          INPUT: ${{ inputs.release-platforms }}
        run: |
          config=$(printf '%s' "$INPUT" | tr -d '\r' | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' \
            | paste -sd, -)

          if [ -z "$config" ]; then
            echo "release-platforms is empty — nothing to check."
          else
            echo "Checking in: $config"
          fi

          echo "config=${config}" >> "$GITHUB_OUTPUT"

      # Skipped rather than called with an empty config.  The action
      # handles one correctly — it returns two empty matrices — but it
      # spends two container pulls to do so, and an empty list is the
      # documented default rather than an edge case, so the answer is
      # worth reaching without them.  A skipped step has no outputs,
      # which is what the `|| '[]'` above turns back into the same two
      # empty matrices, and hence two skipped jobs.
      - id: setup
        if: steps.parse.outputs.config != ''
        uses: r-hub/actions/setup@v1
        with:
          config: ${{ steps.parse.outputs.config }}

  # ── One R CMD check per container flavour ───────────────────────────

  release-containers:

    needs: matrix

    # Two clauses because a skipped `matrix` job — no release label, or a
    # merge_group ref — reports its outputs as empty strings rather than
    # as `[]`, so the `[]` test alone reads true there.  Skip propagation
    # through `needs:` already covers that case, but it stops the moment
    # a status function joins this condition, which is precisely what
    # `release-all` below has to do.  Cheaper to not depend on it.
    if: >-
      needs.matrix.outputs.containers != '' &&
      needs.matrix.outputs.containers != '[]'

    runs-on: ubuntu-latest

    name: ${{ matrix.config.label }}

    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.matrix.outputs.containers) }}

    container:
      image: ${{ matrix.config.container }}

    # The `token:` inputs on the r-hub/actions steps below are declared
    # but unused, so authentication rides on GITHUB_PAT, which is what
    # pak reads.
    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: r-hub/actions/checkout@v1

      # Each image configures its own check: the deps to install
      # (RHUB_ACTIONS_DEPS_DEPENDENCIES, which rchk narrows to LinkingTo),
      # the check arguments (CHECK_ARGS, where the valgrind image supplies
      # --use-valgrind), the check script itself (rchk swaps in rchk.sh),
      # and a long tail of _R_CHECK_* variables — nosuggests hides the
      # Suggests closure with _R_CHECK_DEPENDS_ONLY_ rather than by
      # installing less.  Overriding the deps or the args from here would
      # quietly defeat whichever flavour it contradicts, so both steps run
      # on their defaults and let the container decide.  The `job-config`
      # input does not carry either: setup-deps ignores it outright, and
      # run-check reads only `pre-check` out of it.
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}

      # Sanitizer, valgrind and rchk findings do not fail R CMD check —
      # they land in the .Rout files while the check itself exits 0.  This
      # action greps for them afterwards and fails the job, which is the
      # whole reason it is used instead of r-lib/actions/check-r-package
      # directly.  Those scans key off `matrix.config.label`, so the
      # matrix has to be named `config` and carry `label`.
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}

  # ── One R CMD check per virtual-machine platform ────────────────────
  #
  # Same steps as the container legs, less the `container:` — the runner
  # is whatever `os` the platform resolved to — plus setup-r, since a
  # bare GitHub runner ships no R and the containers do.

  release-vms:

    needs: matrix

    # Empty-string clause as above.
    if: >-
      needs.matrix.outputs.platforms != '' &&
      needs.matrix.outputs.platforms != '[]'

    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.label }}

    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.matrix.outputs.platforms) }}

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: r-hub/actions/checkout@v1

      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}

      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}

      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}

  # ── CRAN-style reverse dependency check ─────────────────────────────
  #
  # Answers the question a submission actually asks -- does this break
  # what CRAN currently ships -- which revdep.yaml cannot, since it
  # installs each downstream from its GitHub branch.  A sibling's `main`
  # may already carry an adaptation the published version lacks, and
  # those diverge precisely when it matters.  This runs alongside
  # revdep.yaml rather than in place of it -- the other one is still the
  # right check for the merge.
  #
  # Deliberately outside `release-all`, and so outside the required
  # check.  Upstream rules it out as a gate: the result "is typically too
  # volatile to use as an automatic pass/fail CI test", turning on
  # platform, hardware, network and unrelated failures in other people's
  # packages.  Running it per push keeps the summary and the per-package
  # artifacts fresh for whichever commit gets submitted; reading them is
  # a person's job.

  # Whether anything on CRAN depends on this package is a fact rather
  # than a judgement, and unlike the platform list it moves without
  # anyone touching the repo -- a package with no dependents today gains
  # its first next month.  So `recheck-which` configures the depth, which
  # is a real choice, and the existence question is derived here.  A
  # repo that opted in before it had dependents therefore starts
  # checking them on its own, and a first release skips in seconds
  # instead of building a container to check nothing.
  #
  # The `strong` and `most` values recheck takes are R's own
  # `tools::package_dependencies()` shorthands, so the input is passed
  # through untranslated and the two definitions cannot drift.

  revdeps:

    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      inputs.recheck-which != ''

    runs-on: ubuntu-latest

    timeout-minutes: 60

    outputs:
      has-revdeps: ${{ steps.count.outputs.has-revdeps }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2

      # Asks CRAN directly rather than the runner's configured mirror:
      # the question is what CRAN currently ships, and a snapshotting
      # binary mirror can answer it as of some other day.
      - name: Count CRAN reverse dependencies
        id: count
        env:
          RECHECK_WHICH: ${{ inputs.recheck-which }}
        run: |
          Rscript -e '
            pkg <- read.dcf("DESCRIPTION", "Package")[[1]]
            which <- Sys.getenv("RECHECK_WHICH")
            db <- available.packages(repos = "https://cloud.r-project.org")
            rd <- tools::package_dependencies(
              pkg, db = db, reverse = TRUE, which = which
            )[[1]]
            n <- length(rd)
            cat(sprintf("%s has %d reverse (%s) dependencies on CRAN\n",
                        pkg, n, which))
            if (n > 0) cat(strwrap(paste(rd, collapse = ", ")), sep = "\n")
            cat(paste0("has-revdeps=", if (n > 0) "true" else "false", "\n"),
                file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          '

  recheck:

    needs: revdeps

    if: needs.revdeps.outputs.has-revdeps == 'true'

    uses: r-devel/recheck/.github/workflows/recheck.yml@v1
    with:
      which: ${{ inputs.recheck-which }}

  # ── Aggregate the matrix result for the required-checks list ────────
  #
  # The `release-all` job shields the required check from changes to the
  # matrix shape: required_status_checks lists this one name instead of
  # a row per flavour.  Treats `skipped` — no label, no platforms configured,
  # or a merge_group ref — as success.
  #
  # Needs `matrix` as well as the two check jobs, and not only for
  # ordering: when the matrix job fails to resolve the platform list,
  # neither check job runs and both are reported as skipped, so
  # aggregating those alone would turn a rejected platform name into a
  # green required check.

  release-all:

    needs: [matrix, release-containers, release-vms]
    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Aggregate release matrix
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          CONTAINERS_RESULT: ${{ needs.release-containers.result }}
          VMS_RESULT: ${{ needs.release-vms.result }}
        run: |
          echo "matrix job result:   $MATRIX_RESULT"
          echo "containers result:   $CONTAINERS_RESULT"
          echo "VM platforms result: $VMS_RESULT"
          for result in "$MATRIX_RESULT" "$CONTAINERS_RESULT" "$VMS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
