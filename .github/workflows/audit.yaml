# Audits, every day, the lockfile that the typescript job of ci.yaml
# installs for each of its callers.
#
# The typescript job installs a caller's lockfile with npm ci, and runs
# code from every package in it.
# An advisory can be published after a version entered the lockfile.
# A check that runs with each pull request sees it only at the next pull
# request of that repo.
# Dependabot alerts read only the default branch, and the callers hold
# their lockfiles on js-state (BristolMyersSquibb/blockr.ci#114).
#
# The callers are the public repos of the organisation whose workflows on
# js-state or main set typescript-dir.
# So a repo joins when it turns the job on, and stays when its lockfile
# moves from js-state to main.
# Each lockfile gets `npm audit --package-lock-only --audit-level=high`.
# The level is high, because critical would let through the compromised
# debug 4.4.2, which its advisory rates high (GHSA-4x49-vf9v-38px).
# An advisory of high or critical severity fails the run, and the job
# summary lists it with the repo, the branch, the package and its version.
# See .github/audit/audit.sh.
#
# GitHub sends the notification of a failed scheduled run to whoever last
# changed the cron line below:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#
# Every job sets `timeout-minutes: 60` — see ci.yaml for why.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/audit/**'
      - '.github/workflows/audit.yaml'

name: audit

permissions:
  contents: read

jobs:

  audit:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # The Node of the typescript job, and so its npm.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit the lockfiles of the callers
        run: bash .github/audit/audit.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: BristolMyersSquibb
          BRANCHES: js-state main
