# pkgdown site build + deploy for blockr.* packages
#
# Reserved for runs on a push to main or to js-state.
# A push to main deploys the site, and a push to js-state deploys the
# site of the new stack under dev/, as described below.
# PR-side pkgdown sanity checks live in ci.yaml's pkgdown-dev job; this
# workflow has no gating role and exists only to ship the rendered site
# to GitHub Pages.
#
# Usage — consumer repo .github/workflows/pkgdown.yaml:
#
#   on:
#     push:
#       branches: main
#
#   name: pkgdown
#
#   jobs:
#     pkgdown:
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/pkgdown.yaml@main
#       secrets:
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#       permissions:
#         contents: write
#
# That caller pushes the site to the gh-pages branch, for a Pages source
# of "Deploy from a branch".  With a Pages source of "GitHub Actions",
# the caller sets `deploy: actions` and grants the Pages scopes instead:
#
#       with:
#         deploy: actions
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# Pass secrets by name. `secrets: inherit` does not forward secrets
# across organisations — the inherited values silently arrive blank in
# the called job.
#
# Until the switch to the new stack, a package also deploys the site
# that its js-state branch builds, and adds that branch to its trigger:
#
#   on:
#     push:
#       branches: [main, js-state]
#
# On js-state, the job sets pkgdown's development mode through the
# variable PKGDOWN_DEV_MODE, so that pkgdown writes the site into
# docs/dev/.
# The default deploy pushes docs/ to gh-pages without removing what is
# there.
# So a deploy from js-state leaves the root of the site alone, and a
# deploy from main leaves dev/ alone.
# With `deploy: actions`, each deploy replaces the whole site.
# So on js-state, the job fails at once in that mode.
#
# A package whose package.json has a script docs builds its TypeScript
# reference with that script, just before the site.
# After the build, the job checks the links of the site with the
# package's script linkcheck, and deploys nothing if a link is broken.
# The pkgdown-dev job of ci.yaml runs the same steps, and explains them.
# Here the job's token may push to the repository, as the deploy needs.
# The deploy step takes that token through an input of its own.
# So, as in pkgdown-dev, only the steps that install the R dependencies
# get GITHUB_PAT, and the checkout leaves no token in the clone.
#
# A caller that sets `image: true` runs the pkgdown job in the image that
# image.yaml builds every day, the one tagged release.
# The job then skips setup-pandoc, setup-r and setup-r-dependencies.
# In their place, the install-deps action installs only what the image
# lacks, and calls apt only for a system package that is missing.
# The deploy job installs nothing, so it runs as before.
# See image.yaml for why.
#
# Every job sets `timeout-minutes: 60` — see ci.yaml for why.

on:
  push:
    branches: main
  workflow_call:
    inputs:

      deploy:
        description: >
          How the built site reaches GitHub Pages.  The default, "branch",
          pushes docs/ to the gh-pages branch and needs `contents: write`
          from the caller.  With "actions", docs/ is uploaded as a Pages
          artifact that a second job publishes with actions/deploy-pages;
          the caller grants `contents: read`, `pages: write` and
          `id-token: write`, and the repository's Pages source must be
          "GitHub Actions".
        type: string
        default: branch
        required: false

      image:
        description: >
          Run the pkgdown job in the image that image.yaml builds, which
          holds R, its tools, and the system and R packages that the repos
          it is built for depend on.
          The job takes the image of release, the R version it also runs
          on without the image.
          The deploy job is unaffected.
          Default false runs every job without the image.
        type: boolean
        default: false
        required: false

    secrets:

      BLOCKR_PAT:
        description: >
          PAT used for authenticated GitHub API calls in dependency
          resolution.  Falls back to github.token when not provided.
        required: false

name: pkgdown

# No `permissions:` anywhere in this file, on purpose.  The two deploy
# modes need different scopes — `contents: write` to push gh-pages,
# `pages: write` and `id-token: write` to publish from Actions — and a
# reusable workflow may not request more than its caller grants.  GitHub
# checks every job against that at startup, including one its `if:`
# would skip, so declaring either mode's scopes fails the other mode's
# callers with a startup_failure.  The caller's per-mode grant is
# therefore authoritative, as in connect-deploy.yaml.  Once the branch
# mode goes, each job can declare its own scopes.

# Pinned for the reason spelled out in ci.yaml's env: block — the
# 'release' default resolves the version through an unretried curl to
# quarto.org, which has twice killed a job on a transient response.
# Keep in step with ci.yaml and revdep.yaml.
env:
  QUARTO_VERSION: '1.10.18'

jobs:

  pkgdown:

    runs-on: ubuntu-latest

    container: ${{ inputs.image && 'ghcr.io/bristolmyerssquibb/blockr.ci:release' || '' }}

    timeout-minutes: 60

    # One group per branch, since the runs of a branch publish the same
    # part of the site: those of main the root, and those of js-state
    # dev/.
    # Queued like `deploy` below, so the newest build of a branch lands
    # last.
    # A group holds one waiting run.
    # With one group for the whole repository, a push to js-state would
    # cancel the waiting run of a push to main, and the root of the site
    # would miss that push.
    # With a group per branch, the runs of two branches can push gh-pages
    # at the same time.
    # So the deploy step below rebases onto a push that came first, rather
    # than force-pushing over it.
    concurrency:
      group: blockr-pkgdown-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # A mistyped `deploy` would otherwise be taken for "branch" and fail
      # only at the push, after the whole build.
      # On js-state, the mode actions would replace the whole site with
      # dev/.
      - name: Check deploy input
        env:
          DEPLOY: ${{ inputs.deploy }}
          REF: ${{ github.ref }}
        run: |
          case "${DEPLOY:-branch}" in
            branch|actions) ;;
            *)
              echo "::error::deploy must be 'branch' or 'actions', got '$DEPLOY'."
              exit 1
              ;;
          esac
          if [ "$DEPLOY" = actions ] && [ "$REF" = refs/heads/js-state ]; then
            echo "::error::On js-state, the site deploys under dev/, which needs deploy 'branch'. With 'actions', each deploy replaces the whole site."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ !inputs.image }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ''
          base-packages: |
            any::pkgdown
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        env:
          GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: website
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        env:
          GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: website

      - name: Remove mermaid config for CI
        run: Rscript -e 'unlink("vignettes/_metadata.yml")'

      # The documentation build, as in ci.yaml's pkgdown-dev job.
      - name: Find the documentation build
        id: docs
        run: |
          script=""
          if [ -f package.json ]; then
            script=$(jq -r '.scripts.docs // empty' package.json)
          fi
          if [ -z "$script" ]; then
            echo "The package.json at the root has no script docs, so the site builds without a TypeScript reference."
            exit 0
          fi
          echo "The script docs of the package.json at the root builds the TypeScript reference."
          echo "run=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/setup-node@v7
        if: steps.docs.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Audit npm dependencies
        if: steps.docs.outputs.run == 'true'
        run: npm audit --package-lock-only --audit-level=high

      - name: Install npm dependencies
        if: steps.docs.outputs.run == 'true'
        run: npm ci --no-audit --ignore-scripts

      - name: Build the TypeScript reference
        if: steps.docs.outputs.run == 'true'
        run: npm run docs

      # On js-state, pkgdown writes the site into docs/dev/.
      # Elsewhere the variable is empty, which leaves the mode to
      # _pkgdown.yml.
      - name: Build site
        env:
          PKGDOWN_DEV_MODE: ${{ github.ref == 'refs/heads/js-state' && 'devel' || '' }}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Check the links of the site
        if: steps.docs.outputs.run == 'true'
        run: npm run linkcheck

      # Without force, the step retries a push that GitHub rejects because
      # a run of another branch pushed gh-pages first.
      # Before it retries, it rebases its commit onto that push.
      # The two runs change different files, the root and dev/, so the
      # rebase finds no conflict.
      - name: Deploy to GitHub pages
        if: inputs.deploy != 'actions'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          force: false
          branch: gh-pages
          folder: docs

      - name: Upload site for GitHub Pages
        if: inputs.deploy == 'actions'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:

    needs: pkgdown

    if: inputs.deploy == 'actions'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    # Serialise deploys without cancelling one in flight: a newer deploy
    # waits, and replaces any older one still waiting.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
