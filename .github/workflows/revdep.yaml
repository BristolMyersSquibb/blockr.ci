# Reverse-dependency CI for blockr.* packages
#
# Runs on merge_group only — reverse-dependency checks are expensive and
# should gate the merge, not every PR push.  The merge_group trigger
# fires when branch protection has the merge queue enabled.
#
# Usage — consumer repo .github/workflows/ci.yaml, alongside the ci.yaml call:
#
#   jobs:
#     ci:
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@main
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#     revdep:
#       if: github.event_name == 'merge_group'
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/revdep.yaml@main
#       with:
#         revdep-packages: |
#           BristolMyersSquibb/blockr.dock
#       secrets:
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#
# The `if:` on the revdep job entry keeps the PR check list clean (a
# single "revdep" skipped row instead of one per matrix entry).  The
# workflow body also gates on merge_group as a safety net, so dropping
# the `if:` still prevents the expensive checks from running — it only
# adds skipped rows to the UI.
#
# Pass secrets by name. `secrets: inherit` does not forward secrets
# across organisations — the inherited values silently arrive blank in
# the called job.
#
# Downstreams come in two tiers.  Those in `revdep-packages` gate the
# merge through `revdep-all`, the one required check, so each one added
# makes its flaky tests the upstream's merge-queue problem.  Those in
# `revdep-info-packages` are checked the same way, on the same queued
# commit, once `revdep-all` has reported, and nothing waits on them: the
# queue merges on the strict tier alone, and the `report` job posts the
# informational outcome to the pull request as one comment once the last
# of those legs finishes, which can be after the merge.
#
# Every job sets `timeout-minutes: 60` — see ci.yaml for why.  An hour
# clears the observed revdep runtime (5-7 min per downstream package) by
# a wide margin.

on:
  workflow_call:
    inputs:

      revdep-packages:
        description: >
          Newline-separated list of downstream packages to reverse-dependency
          check.  A failing leg fails `revdep-all`, so these gate the merge.
        type: string
        default: ''
        required: false

      revdep-info-packages:
        description: >
          Newline-separated list of downstream packages to check the same way
          without gating the merge.  Their legs start once `revdep-all` has
          reported, four at a time at most, and their outcome goes to the
          pull request as one comment, which can land after the merge.  A
          package goes in one list or the other, not both.
        type: string
        default: ''
        required: false

      revdep-test-upstream:
        description: >
          Also run the calling package's own tests in each leg, with the
          downstream installed -- for checks the upstream owns that only mean
          anything against a real consumer.  Those tests gate themselves on
          `REVDEP_PKG`, set here to the downstream under check and unset
          everywhere else, so they stay inert in the upstream's own CI and in
          a developer's working copy.
        type: boolean
        default: false
        required: false

      revdep-test-filter:
        description: >
          Restrict the above to the test files matching this testthat
          `filter` -- `tokens-revdep` selects `test-tokens-revdep.R`.  Empty,
          the default, runs the whole suite.  A filter matching nothing is an
          error rather than an empty pass.  Ignored unless
          `revdep-test-upstream` is set.
        type: string
        default: ''
        required: false

    secrets:

      BLOCKR_PAT:
        description: >
          PAT used for cross-repository checkouts and for authenticated
          GitHub API calls in dependency resolution.  Falls back to
          github.token when not provided.
        required: false

name: revdep

# A read-only token, as in ci.yaml, plus `pull-requests: read`.  Here
# the deps block picks the downstream ref each leg checks out, and the
# merge-queue event carries no pull request body, so parse-deps has to
# fetch it.  On a private repository that fetch needs the scope, and
# without it the block is quietly ignored.
#
# The `report` job alone asks for `pull-requests: write`, for its
# comment.  GitHub checks what every job asks for against the caller's
# grant when the run starts, whether or not the job would run, so a
# caller that sets its own `permissions:`, or whose repository's default
# token is read-only, has to grant `contents: read` and
# `pull-requests: write` even without an informational tier, or GitHub
# fails the run at startup.
permissions:
  contents: read
  pull-requests: read

# Pinned for the reason spelled out in ci.yaml's env: block — the
# 'release' default resolves the version through an unretried curl to
# quarto.org, which has twice killed a job on a transient response.
# Keep in step with ci.yaml and pkgdown.yaml.
env:
  QUARTO_VERSION: '1.10.18'

jobs:

  # ── Build the per-package matrices from the two lists ─────────────────
  #
  # A downstream in both lists would gate the merge and be reported as
  # informational at once.  That is most likely a move from one list to
  # the other left half done, and only the caller can say which list it
  # belongs in, so the job fails and names the package.  Repository names
  # are compared without case, as GitHub resolves them.

  matrix:

    if: github.event_name == 'merge_group'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    outputs:
      packages: ${{ steps.build.outputs.packages }}
      has-packages: ${{ steps.build.outputs.has-packages }}
      info-packages: ${{ steps.build.outputs.info-packages }}
      has-info-packages: ${{ steps.build.outputs.has-info-packages }}

    steps:
      - name: Build revdep matrix
        id: build
        env:
          INPUT: ${{ inputs.revdep-packages }}
          INFO_INPUT: ${{ inputs.revdep-info-packages }}
        run: |
          # One JSON array per list, entries trimmed, blank lines dropped.
          to_json() {
            echo "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              jq -R -s -c 'split("\n") | map(select(length > 0))'
          }
          json=$(to_json "$INPUT")
          info=$(to_json "$INFO_INPUT")

          both=$(jq -n -r --argjson strict "$json" --argjson info "$info" \
            '[$strict[] | ascii_downcase] as $s
             | [$info[] | select(ascii_downcase | IN($s[]))] | join(", ")')
          if [ -n "$both" ]; then
            echo "::error::In both revdep-packages and revdep-info-packages: $both. List each downstream once."
            exit 1
          fi

          non_empty() { if [ "$1" = "[]" ]; then echo false; else echo true; fi; }
          {
            echo "packages=${json}"
            echo "has-packages=$(non_empty "$json")"
            echo "info-packages=${info}"
            echo "has-info-packages=$(non_empty "$info")"
          } >> "$GITHUB_OUTPUT"

  # ── Reverse-dependency checks ────────────────────────────────────────
  #
  # The strict tier.  Its env and steps carry YAML anchors, which
  # `revdep-info` below repeats as aliases, so both tiers check a
  # downstream with the same steps rather than with two copies kept in
  # step by hand.

  revdep:

    needs: matrix

    if: needs.matrix.outputs.has-packages == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.matrix.outputs.packages) }}

    env: &revdep-env
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes

    # Both checkouts leave their token out of .git/config: the steps below
    # run both packages' code, and none of them reaches a remote with git.
    steps: &revdep-leg
      - uses: actions/checkout@v5
        with:
          path: pkg
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The ref a deps block asks for is checked against matrix.pkg's own
      # branches and pull requests, read with the token that checks it out.
      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          pkg: ${{ matrix.pkg }}
          token: ${{ secrets.BLOCKR_PAT || github.token }}
          base-packages: |
            any::rcmdcheck

      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.pkg }}
          ref: ${{ steps.deps.outputs.ref }}
          token: ${{ secrets.BLOCKR_PAT || github.token }}
          path: revdep
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      # Retried once: this is the only Quarto install the workflows own
      # outright (ci.yaml's are nested inside setup-r-dependencies and
      # can't be wrapped from here), and it gates the merge queue, where
      # a failure ejects the PR rather than just reddening a check.  A
      # `uses:` step can't be retried in place, hence the second copy.
      - uses: quarto-dev/quarto-actions/setup@v2
        id: quarto
        continue-on-error: true
        with:
          version: ${{ env.QUARTO_VERSION }}

      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.quarto.outcome == 'failure'
        with:
          version: ${{ env.QUARTO_VERSION }}

      # Each leg checks revdep against the candidate, the merge-queue commit
      # checked out in pkg. One pak resolution installs both: revdep's deps,
      # with revdep's Remotes followed via working-directory, and pkg as a
      # `local::` ref. The checkout satisfies any GitHub pin of pkg in
      # revdep's tree, direct or through another blockr package, since
      # pkgdepends lets a local package stand in for a GitHub ref
      # (r-lib/pkgdepends#229).
      #
      # When pkg's and revdep's Remotes pin some other package to different
      # commits, the resolution fails the leg. That is deliberate: no library
      # holds both, so there is nothing meaningful to check.
      #
      # With `dependencies: c("all", "hard")` pak walks Suggests for the
      # direct refs, revdep and pkg, and only hard deps below them. The
      # Suggests of revdep give the test runner testthat, shinytest2 and the
      # like; those of pkg come along, and revdep's tests should pass with or
      # without them. (`NA` here doesn't have the desired effect: pkgdepends
      # treats it as "soft" applied to both direct and indirect.)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            ${{ steps.deps.outputs.extra-packages }}
            local::${{ github.workspace }}/pkg
          working-directory: revdep
          dependencies: 'c("all", "hard")'
          quarto-version: ${{ env.QUARTO_VERSION }}
          # Bumped to invalidate caches built by an earlier install shape:
          # pak's resolver doesn't remove packages it no longer pulls in, so
          # those caches would carry leftovers.
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: revdep
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # The leg checks the downstream, but the upstream may own checks that
      # only mean anything with a real consumer present -- a shared CSS
      # vocabulary its consumers read, say.  Those are ordinary tests in the
      # upstream's suite, skipping on an unset REVDEP_PKG, and this is the one
      # place it is set.
      #
      # After the check rather than before: installing revdep ahead of it
      # would leave an extra package in libPaths position [1] for the test
      # run, which has been observed to perturb shiny session state in
      # unrelated snapshot tests.
      #
      # NOT_CRAN because a browser-driving test skips itself without it, and
      # a skip here is indistinguishable from a pass.
      - name: Run upstream tests against this downstream
        if: inputs.revdep-test-upstream
        env:
          NOT_CRAN: "true"
          REVDEP_PKG: ${{ matrix.pkg }}
          REVDEP_FILTER: ${{ inputs.revdep-test-filter }}
        run: |
          R CMD INSTALL revdep
          Rscript -e 'filter <- Sys.getenv("REVDEP_FILTER")
            testthat::test_local("pkg", filter = if (nzchar(filter)) filter)'

      # The last two steps run in the informational legs only, for the
      # `report` job.  A matrix job has one set of outputs, which the last
      # leg to finish overwrites, so each leg leaves its outcome in an
      # artifact of its own instead: the package, job.status, and the
      # check run id that links the leg's log.  Under always(), so a failed
      # leg reports too.  A leg that records nothing at all appears in the
      # report as having no result.
      #
      # Inside a called workflow, github.job is the job's id in this file,
      # whatever the caller named its own job.
      - name: Record the outcome for the report
        if: always() && github.job == 'revdep-info'
        env:
          PKG: ${{ matrix.pkg }}
          STATUS: ${{ job.status }}
          JOB_ID: ${{ job.check_run_id }}
          OUT: ${{ runner.temp }}/revdep-info/${{ strategy.job-index }}.json
        run: |
          mkdir -p "$(dirname "$OUT")"
          jq -n --arg pkg "$PKG" --arg status "$STATUS" --arg job "$JOB_ID" \
            '{pkg: $pkg, status: $status, job: $job}' > "$OUT"

      # With `overwrite`, a re-run of the leg replaces its earlier outcome,
      # so the report describes the latest attempt.
      - name: Upload the outcome
        if: always() && github.job == 'revdep-info'
        uses: actions/upload-artifact@v6
        with:
          name: revdep-info-${{ strategy.job-index }}
          path: ${{ runner.temp }}/revdep-info/
          overwrite: true

  # ── Aggregate revdep-matrix result for the required-checks list ──────
  #
  # `revdep-all` shields the merge-queue gate from changes to the matrix
  # shape: required_status_checks lists this name instead of one row per
  # downstream package.  Treats `skipped` (no revdep packages configured,
  # or matrix gated out by event) as success.
  #
  # Needs `matrix` as well as `revdep`, and not only for ordering: when
  # the matrix job fails, `revdep` is reported as skipped rather than
  # failed, so aggregating it alone would turn a failed matrix into a
  # green required check.
  #
  # Needs neither `revdep-info` nor `report`, which wait on it instead:
  # the queue has its answer before the informational tier starts.

  revdep-all:

    needs: [matrix, revdep]
    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Aggregate revdep matrix
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          REVDEP_RESULT: ${{ needs.revdep.result }}
        run: |
          echo "matrix job result:    $MATRIX_RESULT"
          echo "revdep matrix result: $REVDEP_RESULT"
          for result in "$MATRIX_RESULT" "$REVDEP_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # ── Informational reverse-dependency checks ──────────────────────────
  #
  # The downstreams in revdep-info-packages, checked by the steps anchored
  # in `revdep` above, on the same queued commit.  Nothing required waits
  # on this job: `revdep-all` needs only `matrix` and `revdep`, so a
  # failure here never ejects the pull request.
  #
  # It starts once `revdep-all` has reported rather than beside the strict
  # legs, and runs at most four legs at a time.  An account runs a
  # limited number of jobs at once across all its repositories, 20 on
  # GitHub's free plan, and a job beyond that waits for a runner.  Started
  # together with the strict legs, a long informational list could leave
  # one of them, or `revdep-all` itself, waiting behind it.  Started
  # after, it competes only with the rest of the account's CI.  That
  # includes the caller's own `check` matrix and the required `check-all`
  # after it, which revdep.yaml cannot wait for, so `max-parallel` keeps
  # its share to four runners.  It runs whether or not the strict tier
  # passed, since the report is worth having either way.

  revdep-info:

    needs: [matrix, revdep-all]

    if: >-
      !cancelled() &&
      needs.matrix.outputs.has-info-packages == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pkg: ${{ fromJson(needs.matrix.outputs.info-packages) }}

    env: *revdep-env

    steps: *revdep-leg

  # ── One sticky comment for the informational tier ───────────────────
  #
  # Runs once every informational leg has finished, failed ones included,
  # since a failure is what the comment is for.  Nothing required waits on
  # it, so it can post after the merge.  Rewritten in place on every queue
  # run of the pull request, so it describes the latest.
  #
  # The one job with a write scope, which is what the caller has to grant
  # -- see the note on `permissions:` above.  No code from either package
  # runs here: the leg outcomes arrive as data, and the revdep-report
  # action reads them as such.

  report:

    needs: [matrix, revdep-info]

    if: >-
      !cancelled() &&
      needs.matrix.outputs.has-info-packages == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      pull-requests: write

    steps:
      - name: Collect the leg outcomes
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: revdep-info-*
          merge-multiple: true
          path: outcomes

      # Reads each failing downstream's own runs with the token that
      # checked it out, since the downstream may be private.
      - uses: $/.github/actions/revdep-report
        with:
          packages: ${{ needs.matrix.outputs.info-packages }}
          outcomes-dir: outcomes
          body-file: comment.md
          token: ${{ secrets.BLOCKR_PAT || github.token }}

      # The merge-queue event carries no pull request, so sticky-comment
      # reads its number from the queue ref.
      - uses: $/.github/actions/sticky-comment
        with:
          marker: '<!-- revdep-info -->'
          body-file: comment.md
