# Centralised CI pipeline for blockr.* packages
#
# Usage — consumer repo .github/workflows/ci.yaml:
#
#   on:
#     pull_request:
#     merge_group:
#
#   name: ci
#
#   jobs:
#     ci:
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@main
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#
# Pass secrets by name. `secrets: inherit` does not forward secrets
# across organisations (e.g. BristolMyersSquibb/* calling this workflow
# in BristolMyersSquibb/blockr.ci) — the inherited values silently arrive blank in
# the called job.
#
# PR jobs (lint, smoke, pkgdown-dev, coverage, docs, typescript) run in
# parallel and gate the PR.  The merge-queue gate is `check-all`, which
# aggregates the multi-platform `check` matrix; the queue runs only the
# check matrix and skips the PR-side jobs.  Required-status-checks list:
#
#   ci / lint
#   ci / smoke
#   ci / pkgdown-dev
#   ci / coverage
#   ci / docs
#   ci / typescript    (callers that set typescript-dir)
#   ci / check-all
#
# Skipped jobs satisfy required checks, so the queue accepts the PR-only
# rows as skipped on merge_group refs.
#
# A deploy app runs on exactly one R version (whatever Posit Connect
# serves).  Pass `r-version:` (e.g. "4.4.2") so the PR-leg jobs — notably
# the smoke R CMD check — run on that version instead of `release`.
# The `check` matrix is unaffected and keeps its own R versions.
#
# The smoke and check R CMD check jobs fail on NOTEs by default
# (`error-on: '"note"'`), holding the fleet's 0-errors/0-warnings/
# 0-notes bar.  A deploy app that declares unused Imports on purpose —
# so the Connect manifest ships them — passes `error-on: '"warning"'`
# to tolerate the resulting "All declared Imports should be used" NOTE.
#
# The docs job regenerates man/ and NAMESPACE with the roxygen2 version
# pinned in DESCRIPTION (Config/roxygen2/version, or the legacy
# RoxygenNote) — not the latest release, so an upstream roxygen bump
# neither fails the check nor silently reformats the docs — and fails
# when the working tree is then dirty.  A package that carries neither
# field — one that doesn't run roxygen2 — skips the check.
#
# The lint, docs and typescript jobs resolve hard dependencies only.
# None of them runs the test suite or builds vignettes, so the Suggests
# closure buys them nothing but install time — and for a package that
# suggests chromote or shinytest2 it also drags in a 125 MB Chromium
# from a PPA the job never launches, since chromote picks the runner
# image's Google Chrome first.  The other four jobs run the suite or
# build the site and keep Suggests.
#
# A package that does need a suggested package at lint or roxygenize
# time declares it in Config/Needs/lint or Config/Needs/roxygenize.  Two
# cases come up: the roxygen2 run loads whatever `Roxygen: list(packages
# = ...)` names, along with the package behind any pkg::roclet, and
# lintr resolves the library() calls in the files it lints — an
# uninstalled one there becomes a lint, which fails the job.
#
# pkgdown site deploy lives in a separate reusable workflow
# (pkgdown.yaml).  Consumers that want a deployed site add a second
# workflow file calling pkgdown.yaml on `push: branches: main`.
#
# Reverse-dependency checks also live in a separate reusable workflow
# (revdep.yaml).  Consumers with downstream packages to check add a
# second jobs: entry — see revdep.yaml for usage.
#
# The CRAN sanitizer, valgrind and rchk flavours live in release.yaml,
# which wants a consumer-side workflow file of its own rather than a
# jobs: entry here — adding its `labeled` trigger to the on: block above
# would re-run all of ci on every label change.  See release.yaml.
#
# Quarto is installed by setup-r-dependencies whenever the package holds
# a .qmd file, and is pinned to QUARTO_VERSION below rather than left at
# the action's 'release' default — see the env: block for why.
#
# A caller that sets `image: true` runs the Ubuntu jobs in the image that
# image.yaml builds every day.
# The image holds R, the tools these jobs use, and the system and R
# packages of the repos it is built for.
# Those jobs then skip setup-r, setup-pandoc and setup-r-dependencies.
# In their place, the install-deps action installs only what the image
# lacks, and calls apt only for a system package that is missing.
# The macOS and Windows legs and the R-devel leg run as before.
# See image.yaml for why.
#
# Every job in every workflow here sets `timeout-minutes: 60`, with one
# deliberate exception noted below; the other nine files carry a one-line
# pointer back to this paragraph, so keep them in step (`grep -rn
# timeout-minutes .github/workflows`).
#
# GitHub's default is six hours, so a step that hangs instead of failing
# — an apt index fetch from an Ubuntu archive mirror that stops
# answering, say — leaves the PR showing checks in progress and holds a
# runner until someone cancels by hand.  An hour is deliberately far
# above normal runtime rather than close to it: the slowest job in the
# fleet is the ubuntu-devel check leg at roughly 15 min, and everything
# else lands well under that, but those are cache hits.  A cold cache
# building the dependency tree from source is legitimately much slower,
# and a timeout sized off the happy path would turn honest runs red.
# The point is to bound a pathological stall, not to police performance.
#
# The exception is release.yaml's per-flavour container job, at 180.
# Those legs build the package from source under an instrumented
# toolchain, and the valgrind one then runs the suite tens of times
# slower than native, so an hour would sit close to legitimate runtime
# rather than far above it — which is the property the paragraph above
# is actually asking for.

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:

      lintr-exclusions:
        description: >
          Newline-separated file paths to exclude from linting.
        type: string
        default: ''
        required: false

      coverage-threshold:
        description: >
          Minimum coverage percentage required for the coverage job to
          pass.  Default 0 disables the gate; coverage is still computed
          and uploaded to Codecov.
        type: number
        default: 0
        required: false

      r-version:
        description: >
          R version for the PR-leg jobs (lint, smoke, pkgdown-dev,
          coverage, docs, typescript).  Default '' runs them on 'release'.
          Set it (e.g. '4.4.2') for a deploy app that runs on exactly one
          R version, so its PR checks — notably the smoke R CMD check —
          exercise the deployment target.
          The check matrix is unaffected and keeps its own R versions.
        type: string
        default: ''
        required: false

      error-on:
        description: >
          R CMD check severity that fails the smoke and check jobs,
          passed through to r-lib/actions/check-r-package's error-on.
          Default '' fails on any NOTE, holding the
          0-errors/0-warnings/0-notes bar.  A deploy app that declares
          unused Imports on purpose — so the Connect manifest ships
          them — sets '"warning"' to tolerate the resulting "All
          declared Imports should be used" NOTE.
        type: string
        default: ''
        required: false

      typescript-dir:
        description: >
          Directory of the package's package.json, relative to the
          repository root (e.g. '.').  Setting it turns on the typescript
          job, which runs the package's typecheck, lint, test and build
          scripts and fails where the build leaves inst/ other than
          committed.
          The tests must write their coverage as LCOV to
          coverage/lcov.info in that directory, which the job uploads to
          Codecov.
          Default '' skips the job.
        type: string
        default: ''
        required: false

      image:
        description: >
          Run the Ubuntu jobs in the image that image.yaml builds, which
          holds R, their tools, and the system and R packages of the repos
          it is built for.
          The PR-leg jobs take the image of r-version, and the oldrel-1 leg
          of the check matrix the image of oldrel-1.
          Images exist for release and oldrel-1 only, so r-version must be
          '', release or oldrel-1.
          The macOS, Windows and R-devel legs are unaffected.
          Default false runs every job without the image.
        type: boolean
        default: false
        required: false

      skip-pkgdown:
        description: >
          DEPRECATED.  The pkgdown job moved out of ci.yaml into a
          separate pkgdown.yaml reusable workflow; this input is now a
          no-op and will be removed once all consumers have migrated.
          Consumers opt in by adding a pkgdown.yaml workflow rather
          than by gating ci.yaml.
        type: boolean
        default: false
        required: false

      revdep-packages:
        description: >
          DEPRECATED.  Reverse-dependency checks moved to revdep.yaml;
          this input is now a no-op and will be removed once all
          consumers have migrated.  See revdep.yaml for the new usage.
        type: string
        default: ''
        required: false

    secrets:

      CODECOV_TOKEN:
        description: >
          Codecov upload token.  Required for authenticated coverage
          uploads; without it Codecov falls back to tokenless uploads
          which are subject to aggressive rate-limiting.
        required: false

      BLOCKR_PAT:
        description: >
          PAT used for authenticated GitHub API calls in dependency
          resolution.  Falls back to github.token when not provided.
        required: false

name: ci

# A read-only token for every job, since nothing here writes to the
# repository.  A called workflow can lower what its caller grants but
# not raise it, so this holds whatever the caller passes.
#
# Only `contents: read`, although the parse-deps steps read the pull
# request.  A caller that sets its own `permissions:` withholds every
# scope it does not name, and GitHub fails a called workflow that asks
# for a withheld one at startup, before any job runs.  Here the read
# only validates the deps block, and parse-deps carries on without the
# fresh body when it fails.
permissions:
  contents: read

# One run per pull request at a time.  A push cancels the run still
# checking the commit it replaces.  Any other pull-request event —
# reopening, or a label in the release workflows — re-checks the same
# commit, so it waits for the run in progress rather than discarding it.
#
# Runs outside a pull request key on their run id, so none ever shares a
# group.  The ref would keep merge-queue entries apart as well, but a
# caller that also runs this on push to main would then queue its
# pushes, and each new one would cancel the push still waiting.
#
# The prefix is a literal, one per workflow file, because in a called
# workflow github.workflow resolves to the caller's name, and a group
# the caller shares with the called workflow cancels the caller.
concurrency:
  group: blockr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

# Quarto version installed by setup-r-dependencies (it pulls in
# quarto-dev/quarto-actions/setup for any package holding a .qmd).
#
# Pinned because that action's 'release' default resolves the version at
# job time, piping an unretried curl of
# https://quarto.org/docs/download/_download.json straight into jq.
# Under bash's pipefail any hiccup from quarto.org kills the step and
# ejects an otherwise-green PR — observed both as a non-JSON body (jq
# parse error, exit 5) and as a 30s stall then connection reset (curl
# exit 35).  An explicit version skips the lookup entirely and goes
# straight to the release asset, which the action fetches with wget
# (20 retries by default).
#
# Windows is exempt throughout: quarto-actions installs there through
# scoop and skips the lookup, so pinning buys nothing and would swap a
# working install for scoop's versioned-install path.
#
# Bump deliberately: this is the Quarto that builds every consumer's
# vignettes.  Latest release: https://quarto.org/docs/download/
env:
  QUARTO_VERSION: '1.10.18'

jobs:

  # ── Lint (PR gate) ───────────────────────────────────────────────────

  lint:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}

    steps:
      - name: Warn on deprecated revdep-packages input
        if: inputs.revdep-packages != ''
        run: |
          echo "::warning::The 'revdep-packages' input on ci.yaml is deprecated and no longer triggers reverse-dependency checks. Migrate by dropping it from the ci.yaml call and adding a second jobs entry pointing at revdep.yaml (gated with 'if: github.event_name == \"merge_group\"'). See BristolMyersSquibb/blockr.ci#9."

      - name: Warn on deprecated skip-pkgdown input
        if: inputs.skip-pkgdown
        run: |
          echo "::warning::The 'skip-pkgdown' input on ci.yaml is deprecated. The pkgdown job moved into pkgdown.yaml; consumers opt in by adding a pkgdown.yaml workflow rather than gating ci.yaml. See BristolMyersSquibb/blockr.ci#17."

      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::lintr
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        with:
          dependencies: '"hard"'
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: lint
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        with:
          dependencies: '"hard"'
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: lint

      - name: Write lintr config
        if: ${{ hashFiles('.lintr') == '' }}
        env:
          LINTR_EXCLUSIONS: ${{ inputs.lintr-exclusions }}
        shell: Rscript {0}
        run: |
          excl <- Sys.getenv("LINTR_EXCLUSIONS")
          paths <- if (nzchar(excl)) trimws(strsplit(excl, "[,\n]")[[1]]) else character()
          paths <- paths[nzchar(paths)]

          cfg <- "linters: linters_with_defaults(\n  object_name_linter = NULL\n  )"
          if (length(paths)) {
            items <- paste0('  "', paths, '"', collapse = ",\n")
            cfg <- paste0(cfg, "\nexclusions: list(\n", items, "\n  )")
          }
          writeLines(cfg, ".lintr")

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  # ── Smoke test (single-platform quick check, PR gate) ────────────────

  smoke:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ !inputs.image }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::rcmdcheck
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: check
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: check

      - name: Remove mermaid config for CI
        run: Rscript -e 'unlink("vignettes/_metadata.yml")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: ${{ inputs.error-on || '"note"' }}

  # ── pkgdown dev build (PR gate, no deploy) ───────────────────────────

  pkgdown-dev:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ !inputs.image }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::pkgdown
            any::pkgload
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: website
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: website

      - name: Remove mermaid config for CI
        run: Rscript -e 'unlink("vignettes/_metadata.yml")'

      - name: Build site (devel)
        run: pkgdown::build_site(devel = TRUE, new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload built site
        uses: actions/upload-artifact@v6
        with:
          name: pkgdown-site
          path: docs/
          if-no-files-found: error

  # ── Test coverage (PR gate, optional threshold) ──────────────────────

  coverage:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::covr

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: coverage
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: coverage

      - name: Compute, upload and gate coverage
        shell: Rscript {0}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )

          pct <- covr::percent_coverage(cov)
          cat(sprintf("Coverage: %.2f%%\n", pct))

          # Warn rather than fail when Codecov refuses the upload, so that a
          # refusal on its side can't block PRs through the required
          # ci / coverage check (#67).
          # Since covr 4.0.0, codecov() throws a covr_codecov_error on a
          # refusal, warns and returns NULL on a rate limit or an outage, and
          # returns a list holding the url of an accepted upload (#103).
          # The covr 3 that a restored package cache can still hold returns
          # the response whatever its status, and only an accepted upload
          # carries uploaded: TRUE.
          # The flag r sets this upload apart from the coverage that the
          # typescript job uploads under the flag typescript.
          # Codecov merges the two into one report for the commit.
          res <- tryCatch(
            covr::codecov(coverage = cov, flags = "r"),
            covr_codecov_error = function(e) {
              message(conditionMessage(e))
              NULL
            }
          )
          accepted <- if (is.list(res) && "uploaded" %in% names(res)) {
            isTRUE(res$uploaded)
          } else {
            is.list(res)
          }
          # The reply of covr 4 also holds a signed upload location, so only
          # its url is printed.
          if (accepted && is.character(res$url)) {
            cat("Coverage uploaded to Codecov:", res$url, "\n")
          } else if (accepted) {
            cat("Coverage uploaded to Codecov.\n")
          } else {
            if (!is.null(res)) print(res)
            cat("::warning title=Codecov upload failed::Codecov did not accept the upload; its reply is printed above.\n")
          }

          threshold_env <- Sys.getenv("COVERAGE_THRESHOLD")
          threshold <- if (nzchar(threshold_env)) as.numeric(threshold_env) else 0
          # A package with no R code has no coverable lines, so covr
          # reports NaN.  Nothing in it is uncovered, and isTRUE() lets
          # NaN pass instead of erroring on if (NA).
          if (isTRUE(pct < threshold)) {
            stop(sprintf(
              "Coverage %.2f%% below threshold %.2f%%",
              pct, threshold
            ))
          }

      - name: Show testthat output
        if: always()
        run: |
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  # ── Docs freshness (PR gate) ─────────────────────────────────────────
  #
  # Regenerate man/ + NAMESPACE with the roxygen2 pinned in DESCRIPTION
  # (Config/roxygen2/version, or the legacy RoxygenNote) and fail on
  # drift, so generated docs can't diverge from the pin.  Pinning keeps
  # an upstream roxygen bump from silently reformatting docs.  A package
  # with neither pin skips the check.

  docs:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Read roxygen2 version pin
        id: pin
        run: |
          # roxygen2 8.0.0 renamed the pin field RoxygenNote ->
          # Config/roxygen2/version; read the new field first, fall back
          # to the legacy one, skip only when neither is present.
          version="$(sed -nE 's|^Config/roxygen2/version:[[:space:]]*([^[:space:]]+).*|\1|p' DESCRIPTION)"
          if [ -z "$version" ]; then
            version="$(sed -nE 's/^RoxygenNote:[[:space:]]*([^[:space:]]+).*/\1/p' DESCRIPTION)"
          fi
          if [ -z "$version" ]; then
            echo "No Config/roxygen2/version or RoxygenNote pin in DESCRIPTION; skipping docs-freshness check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pinning roxygen2 to $version."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        if: steps.pin.outputs.run == 'true' && !inputs.image
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        if: steps.pin.outputs.run == 'true'
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.pin.outputs.run == 'true' && !inputs.image
        with:
          dependencies: '"hard"'
          extra-packages: |
            ${{ steps.deps.outputs.extra-packages }}
            roxygen2@${{ steps.pin.outputs.version }}
          needs: roxygenize
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: steps.pin.outputs.run == 'true' && inputs.image
        with:
          dependencies: '"hard"'
          extra-packages: |
            ${{ steps.deps.outputs.extra-packages }}
            roxygen2@${{ steps.pin.outputs.version }}
          needs: roxygenize

      - name: Regenerate documentation
        if: steps.pin.outputs.run == 'true'
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Fail on stale man/ or NAMESPACE
        if: steps.pin.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated documentation is up to date."
            exit 0
          fi
          echo "::error::Generated documentation is out of date. Regenerate with the pinned roxygen2 (roxygen2::roxygenise()) and commit the updated man/ and NAMESPACE."
          git add -A
          git diff --cached
          exit 1
        shell: bash

  # ── TypeScript gates (PR gate, opt-in via typescript-dir) ────────────
  #
  # Run the package's own typecheck, lint, test and build scripts in the
  # directory typescript-dir names, assuming nothing of the tools behind
  # them, and fail where the build leaves inst/ other than committed:
  # R CMD check and CRAN run no Node, so a package that builds its
  # modules commits what the build writes there.  One that writes its
  # modules in JS has no build script to run.
  #
  # The JS a package builds against ships inside its R dependencies, as
  # blockr.core's types do, so R and the hard dependencies come first.
  # Each script runs once npm ci has succeeded, so one run reports every
  # gate that fails.  Node is pinned to the 24 LTS line, which the runner
  # image caches, so setup-node downloads nothing; bump it deliberately.
  #
  # The tests write their coverage as LCOV to coverage/lcov.info.
  # Vitest, Jest and c8 write their reports to coverage/, and their lcov
  # reporter names the file lcov.info.
  # Every package that runs this job reports its coverage, so the job
  # fails when the tests pass without writing the file.
  # Otherwise it uploads the file to Codecov under the flag typescript.
  # The coverage job uploads the R coverage under the flag r, and both
  # uploads name the head commit of the pull request.
  # So Codecov merges them into one report.
  #
  # The Codecov token reaches the upload step alone, through the token
  # input of the action, since the npm packages run their code in this job.
  # The action exits 0 when Codecov refuses the upload or is down, unless
  # fail_ci_if_error is set.
  # So a failure on Codecov's side leaves the job green, as it does the
  # coverage job (#67).

  typescript:

    if: github.event_name == 'pull_request' && inputs.typescript-dir != ''

    runs-on: ubuntu-latest

    container: ${{ inputs.image && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', inputs.r-version || 'release') || '' }}

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}

    defaults:
      run:
        working-directory: ${{ inputs.typescript-dir }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !inputs.image }}
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !inputs.image }}
        with:
          dependencies: '"hard"'
          quarto-version: ${{ env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: ${{ inputs.image }}
        with:
          dependencies: '"hard"'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ inputs.typescript-dir }}/package-lock.json

      - name: Install npm dependencies
        id: install
        run: npm ci

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Find the coverage of the tests
        id: lcov
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: |
          if [ -s coverage/lcov.info ]; then
            echo "The tests wrote their coverage to coverage/lcov.info."
            exit 0
          fi
          echo "::error::The tests passed but wrote no coverage to coverage/lcov.info. Turn on coverage for npm test, with a reporter that writes LCOV to that file, as the TypeScript gates of the blockr.ci README describe."
          exit 1
        shell: bash

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.typescript-dir }}/coverage/lcov.info
          disable_search: true
          flags: typescript

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build --if-present

      - name: Fail on stale inst/
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$(git status --porcelain -- inst)" ]; then
            echo "Nothing in inst/ changed."
            exit 0
          fi
          git add --all -- inst
          echo "::error::The build changed files under inst/: $(git diff --cached --name-only -- inst | paste -sd ' '). Run npm run build and commit what it writes there."
          git diff --cached --stat -- inst
          exit 1
        shell: bash

  # ── Full R CMD check (multi-platform, merge queue gate) ──────────────

  check:

    # A release tarball is built from a commit on its pull request and
    # submitted before the branch merges, so on a pull request labelled
    # `release` this matrix runs per push — anything the queue reported
    # would arrive too late to act on.  It still runs at the queue as
    # well, for every pull request including that one: the queue tests
    # the would-be merge commit, and skipping it there would reopen the
    # red-main gap the queue exists to close.
    #
    # The R-devel leg is the one exception.
    # It runs on a release pull request only, never at the queue.
    # The leg builds its dependencies from source, so in blockr.core's
    # queue it took 15–22 minutes, against 3–7 for the other legs.
    # In 187 queue runs, it found nothing the other legs missed (#95).
    # An R-devel failure can therefore reach main.
    # It then shows up at the next release.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ${{ matrix.config.os }}

    container: ${{ inputs.image && matrix.config.os == 'ubuntu-latest' && matrix.config.r != 'devel' && format('ghcr.io/bristolmyerssquibb/blockr.ci:{0}', matrix.config.r) || '' }}

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
        # R-devel joins on a release pull request only — see above.
        include: >-
          ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'release')
          && '[{"config": {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"}}]'
          || '[]') }}

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes
      IN_IMAGE: ${{ inputs.image && matrix.config.os == 'ubuntu-latest' && matrix.config.r != 'devel' }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        if: env.IN_IMAGE != 'true'

      - uses: r-lib/actions/setup-r@v2
        if: env.IN_IMAGE != 'true'
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: $/.github/actions/parse-deps
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::rcmdcheck
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.IN_IMAGE != 'true'
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: check
          # The only matrix carrying Windows, where the pin is skipped —
          # see the env: block.
          quarto-version: ${{ matrix.config.os == 'windows-latest' && 'release' || env.QUARTO_VERSION }}

      - uses: $/.github/actions/install-deps
        if: env.IN_IMAGE == 'true'
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: check

      - name: Remove mermaid config for CI
        run: Rscript -e 'unlink("vignettes/_metadata.yml")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: ${{ inputs.error-on || '"note"' }}

  # ── Aggregate check-matrix result for the required-checks list ───────
  #
  # `check-all` shields the merge-queue gate from changes to the matrix
  # shape: required_status_checks lists this name instead of each
  # platform/R-version entry.  Treats `skipped` (PR runs, where the
  # matrix doesn't fire) as success.

  check-all:

    needs: check
    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Aggregate check matrix
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          echo "check matrix result: $CHECK_RESULT"
          case "$CHECK_RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
