# Mechanical release checks for blockr.* packages
#
# The release.yaml flavour matrix covers the expensive half of a release
# check: container images, an instrumented toolchain, valgrind.  The
# cheap half — does the version have three components, is the Remotes
# field gone, does every documented function say what it returns — has
# been a manual checklist, and being manual is what makes it unreliable.
# A maintainer runs the check, sees it clean, ticks the box, then edits a
# vignette three commits later; the tick records that something was true
# once, not that it is true at the commit about to be submitted.
#
# These checks take seconds, so they run on every push to the release
# pull request and report against its head commit.  That is the whole
# point: a green row here means the gate holds *now*, at the commit a
# tarball would be built from.
#
# Usage — consumer repo .github/workflows/release-gate.yaml, a file of
# its own for the same reason release.yaml gets one:
#
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize, labeled]
#     merge_group:
#
#   name: release-gate
#
#   permissions:
#     contents: read
#     pull-requests: write
#
#   jobs:
#     release-gate:
#       uses: BristolMyersSquibb/blockr.ci/.github/workflows/release-gate.yaml@main
#       secrets:
#         BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
#
# Required-status-checks list: `release-gate / release-gate-all`.
#
# Not covered here, deliberately: devtools::check_win_devel() mails its
# result 15-30 minutes later, so nothing can gate on it, and
# check(manual = TRUE) wants a LaTeX toolchain this job would pay for on
# every push.  Both stay on the maintainer's release checklist.
#
# ── Deliberately separate from release.yaml ─────────────────────────
#
# Those jobs are container images on their own cadence; these are an
# ordinary R session.  Keeping them apart means a two-second gate does
# not queue behind a valgrind run, and a red gate is legible on its own
# rather than as one row inside a flavour matrix.
#
# ── No inputs, and secrets optional ─────────────────────────────────
#
# Everything here is derived from the repository, so there is nothing to
# configure and the workflow is callable from outside the blockr fleet.
# BLOCKR_PAT is optional and falls back to github.token, which keeps
# "needs no secrets" a real property: nbenn/typedjson does not use
# ci.yaml and is the package most in need of this gate.
#
# ── Trigger, and why the caller carries no `if:` ────────────────────
#
# Same shape as release.yaml: gated on the `release` label being
# *present*, which holds on every subsequent push, with `labeled` in the
# caller's `on:` block so applying the label starts a run on a branch
# that is already pushed.  Per #52, gating the *caller* removes the
# nested contexts entirely, leaving a required
# `release-gate / release-gate-all` stuck at "Expected — waiting for
# status"; an absent context is not a skipped one.  So the caller runs
# on every event and only the inner jobs are conditional.
#
# The `merge_group` ref passes through, as in release.yaml.  There is no
# pull request and no label at the queue, so the label-gated jobs cannot
# run there even in principle, and a required context that is never
# created burns the queue's check_response_timeout_minutes instead of
# merging.  Skipped jobs satisfy required checks, so `release-gate-all`
# reports green there.
#
# ── What devtools carries, and what it cannot ───────────────────────
#
# Wherever devtools exports a function that returns a usable value, it
# is called rather than rewritten: check_doc_fields(), build_readme()
# and spell_check() all do, and all three run here.  (The last one is a
# two-line wrapper over spelling::spell_check_package(), so the wrapped
# function is called instead and 94 dependencies stay out of a job that
# needs 12.)
#
# The five release_checks() conditions are the exception, and not by
# preference.  They are not exported, and they route through
# devtools:::check_status(), which returns NULL whether the check passed
# or failed — measured, on both branches.  A script calling a *failing*
# check_version() exits 0, so a job built on it would be green
# regardless of what it found, which is precisely the failure mode this
# workflow exists to remove.  Measured further, the finding does exist,
# but only as cli-formatted text on stderr, so the alternative to
# reimplementing is grepping a message stream through ::: and coupling
# to print formatting.  Reimplementing the rule is the smaller coupling;
# see the release-gate action for the per-check reasoning.
#
# ── Hard gates and soft checks ──────────────────────────────────────
#
# The `gate` and `docs` jobs fail the build.  They are split by cost
# rather than by topic: `gate` reads files, and its only dependency is
# desc — two recursive packages, and the one that owns the DESCRIPTION
# grammar — so it answers in seconds, while `docs` needs devtools and
# the package itself installed.  Splitting them keeps a wrong version
# number visible long before the dependency tree has resolved.
#
# The `soft` job never fails on a finding.  Spelling, urlchecker results
# and --as-cran NOTEs turn on jargon, third-party redirects, transient
# 503s and CRAN's own incoming feasibility service, and a volatile
# signal used as a gate is one that gets ignored or switched off.  It is
# the same argument r-devel/recheck makes about itself.  The `soft` job
# is not in `release-gate-all` and so is never required — a red row
# there means the checks could not be computed, which is worth seeing
# and blocks nothing.
#
# ── Making the soft output visible ──────────────────────────────────
#
# Reporting into the job log alone defeats the purpose, since nobody
# opens a green job.  Two mechanisms, deliberately combined: each job
# writes its detail to $GITHUB_STEP_SUMMARY, which needs no permissions
# at all, and the `report` job rewrites a single sticky pull-request
# comment so it always describes the head commit rather than growing a
# tail of stale ones.  The comment needs `pull-requests: write` from the
# caller; without it — and on a fork pull request, where the token is
# read-only whatever the caller asks for — the step warns and moves on,
# leaving the step summaries as the fallback path.
#
# ── Reverse dependencies ────────────────────────────────────────────
#
# The recheck result that #54 keeps out of `release-all` is linked from
# the comment rather than embedded in it.  It lives in a different
# workflow, on a different clock: recheck builds containers for tens of
# minutes while this gate finishes in seconds, so any conclusion this
# workflow could read at comment time would be "queued", and a comment
# rewritten per push would never catch up.  A link to the commit's own
# check list cannot go stale and lands the reader on the live result.
#
# Every job here sets `timeout-minutes: 60` — see ci.yaml for why.

on:
  workflow_call:
    secrets:

      BLOCKR_PAT:
        description: >
          PAT used for authenticated GitHub API calls in dependency
          resolution, and for reaching packages named in Remotes that
          live in private repositories.  Falls back to github.token when
          not provided.
        required: false

name: release-gate

# Pinned rather than left at the action's 'release' default, which
# resolves the version at job time through an unretried curl of
# quarto.org -- see ci.yaml for the full reasoning and keep the four
# files in step.  Reached here only by a repository whose README is a
# .qmd; every other package installs no Quarto at all.
env:
  QUARTO_VERSION: '1.10.18'

jobs:

  # ── Hard gates: DESCRIPTION, NEWS and the vignette headers ──────────
  #
  # Setup-r, one small install and one Rscript, so this finishes in
  # seconds.  The package under test is never installed and its
  # dependency tree is never resolved, which is what keeps this job
  # answering long before `docs` has finished provisioning.

  gate:

    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: BristolMyersSquibb/blockr.ci/.github/actions/release-gate@main
        with:
          # Written outside the workspace on purpose: the readme job
          # below fails on a dirty tree, and a fragment dropped into the
          # checkout would be the dirt.
          summary-file: ${{ runner.temp }}/parts/10-gate.md

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-part-gate
          path: ${{ runner.temp }}/parts/
          if-no-files-found: warn

  # ── Hard gate: the checks devtools can answer ───────────────────────
  #
  # Two of the seven are exported by devtools and return usable values,
  # so they are called rather than rewritten: check_doc_fields() names
  # the Rd files missing a section, and build_readme() renders the
  # README the way a maintainer would.
  #
  # This is where the devtools install lands -- 94 recursive hard
  # dependencies, against rcmdcheck's 15 and urlchecker's 5.  That cost
  # is why the DESCRIPTION-level checks stay in their own job above:
  # `gate` keeps its zero-install property and reports in seconds while
  # this one is still resolving packages, which is the common case when
  # a release branch is being iterated.
  #
  # Only \value is gated, though check_doc_fields() defaults to
  # c("value", "examples").  The second does not hold across this fleet:
  # measured, blockr.core is missing \examples in 35 Rd files,
  # blockr.dplyr in 10, blockr.ui in 6 and blockr.ggplot in 3, against
  # one single missing \value between them.  A gate every package fails
  # on its first run is one that gets switched off, and CRAN treats the
  # two differently anyway.
  #
  # Using build_readme() rather than a hand-rolled render buys the
  # README.qmd path for free -- it dispatches on the extension and
  # renders a .qmd through Quarto -- and keeps the html_preview = FALSE
  # detail in devtools' hands rather than this file's.  That flag is
  # load-bearing: the default github_document format also writes a
  # README.html, and that untracked file would fail the dirty-tree
  # comparison on every run.
  #
  # A repository with a README.qmd needs the quarto CLI and the quarto
  # package; when they are absent, build_readme() aborts and this job
  # goes red with devtools' own message.  That is deliberate -- a loud
  # failure beats the silent pass a "we do not check .qmd" branch would
  # give.  A package with no executable README at all skips.

  docs:

    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Look for an executable README
        id: readme
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/parts"

          found=""
          for candidate in README.qmd README.Rmd inst/README.qmd inst/README.Rmd; do
            if [ -f "$candidate" ]; then
              found="$candidate"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "No executable README; nothing to regenerate."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $found; regenerating it to compare."
          echo "run=true" >> "$GITHUB_OUTPUT"

          # Quarto reaches the runner through setup-r-dependencies, which
          # installs it for a package holding a .qmd; the R-side binding
          # has to be asked for by name.
          case "$found" in
            *.qmd) echo "extra=any::quarto" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: BristolMyersSquibb/blockr.ci/.github/actions/parse-deps@main
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::devtools
            local::.

      # Keeps Suggests, unlike ci.yaml's lint and docs jobs: a README
      # chunk routinely calls a suggested package, and a hard-only
      # install would fail the render rather than the comparison.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            ${{ steps.deps.outputs.extra-packages }}
            ${{ steps.readme.outputs.extra }}
          quarto-version: ${{ env.QUARTO_VERSION }}

      # Records its verdict instead of exiting on it, so a missing
      # \value and a stale README are reported from one run rather than
      # one per push.
      - name: Check Rd value sections
        id: fields
        shell: Rscript {0}
        env:
          PART: ${{ runner.temp }}/parts/20-docs.md
        run: |
          part <- Sys.getenv("PART")
          dir.create(dirname(part), recursive = TRUE, showWarnings = FALSE)

          missing <- if (dir.exists("man")) {
            devtools::check_doc_fields(".", fields = "value")$value
          } else {
            character()
          }

          md <- c(
            "### Rd \\value sections",
            "",
            if (!dir.exists("man")) {
              ":heavy_minus_sign: No man/ directory."
            } else if (length(missing)) {
              c(
                sprintf(
                  ":x: %d documented function(s) do not say what they return.",
                  length(missing)
                ),
                "",
                paste0("- `", missing, "`")
              )
            } else {
              ":white_check_mark: Every documented function has a \\value section."
            },
            ""
          )

          write(md, file = part, append = TRUE)
          write(md, file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)

          write(
            paste0("ok=", if (length(missing)) "false" else "true"),
            file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE
          )

      - name: Regenerate the README
        id: render
        if: steps.readme.outputs.run == 'true'
        shell: Rscript {0}
        run: devtools::build_readme(".", quiet = FALSE)

      - name: Report README freshness and fail on either gate
        if: always()
        shell: bash
        env:
          FIELDS_OK: ${{ steps.fields.outputs.ok }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          README_RUN: ${{ steps.readme.outputs.run }}
        run: |
          part="${{ runner.temp }}/parts/20-docs.md"
          mkdir -p "$(dirname "$part")"
          failed=0

          {
            echo "### README freshness"
            echo
          } >> "$part"

          if [ "$README_RUN" != true ]; then
            echo ":heavy_minus_sign: No executable README, so nothing to regenerate." >> "$part"
          elif [ "$RENDER_OUTCOME" != success ]; then
            # A render that died leaves the tree clean, so reading the
            # tree alone would report "current" -- the false green this
            # workflow exists to remove.
            echo ":x: The README did not render, so its freshness is unknown. See the job log." >> "$part"
            failed=1
          else
            drift="$(git status --porcelain)"

            if [ -z "$drift" ]; then
              echo ":white_check_mark: README.md is current with its source." >> "$part"
            else
              echo "::error::README.md is out of date. Regenerate it (devtools::build_readme()) and commit the result."
              git add -A
              git diff --cached
              {
                echo ":x: README.md does not match its source. Regenerate it with \`devtools::build_readme()\` and commit the result."
                echo
                echo '```'
                echo "$drift"
                echo '```'
              } >> "$part"
              failed=1
            fi
          fi

          echo >> "$part"
          cat "$part" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FIELDS_OK" != true ]; then
            printf '%s\n' '::error::One or more documented functions have no \value section.'
            failed=1
          fi

          exit "$failed"

      - name: Upload docs summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-part-docs
          path: ${{ runner.temp }}/parts/
          if-no-files-found: warn

  # ── Soft checks: reported on every push, never a gate ───────────────
  #
  # Runs the CRAN incoming feasibility checks that ci.yaml's matrix does
  # not.  That matrix already checks --as-cran and fails on any NOTE, but
  # with _R_CHECK_CRAN_INCOMING_ off it never reaches the checks a
  # submission is actually read against: new-submission notes, the
  # licence and URL scan, the DESCRIPTION spell check, maintainer
  # address.  Those are the ones worth seeing before uploading, and the
  # ones too volatile to gate on — they query CRAN over the network.

  soft:

    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: BristolMyersSquibb/blockr.ci/.github/actions/parse-deps@main
        id: deps
        with:
          pr-body: ${{ github.event.pull_request.body }}
          pr-number: ${{ github.event.pull_request.number }}
          base-packages: |
            any::rcmdcheck
            any::urlchecker
            any::spelling
            local::.

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ steps.deps.outputs.extra-packages }}
          needs: check

      - name: Prepare the soft-check summary
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/parts"
          {
            echo "### Soft checks"
            echo
            echo "Reported on every push, never a gate."
            echo
          } > "${{ runner.temp }}/parts/30-soft.md"

      # The spell_check() entry point in devtools is a two-line wrapper
      # over spelling::spell_check_package(), so the wrapped function is
      # called directly -- it is the same check, and it keeps 94
      # dependencies out of a job that otherwise needs 12.  Honours inst/WORDLIST, which is
      # what makes a spell check survivable on a package with jargon.
      - name: Check spelling
        if: always()
        shell: Rscript {0}
        env:
          PART: ${{ runner.temp }}/parts/30-soft.md
        run: |
          part <- Sys.getenv("PART")
          dir.create(dirname(part), recursive = TRUE, showWarnings = FALSE)

          res <- tryCatch(
            spelling::spell_check_package("."),
            error = function(e) conditionMessage(e)
          )

          md <- if (is.character(res)) {
            c(
              "#### Spelling",
              "",
              paste0(":warning: The spell check could not run: ", res),
              ""
            )
          } else if (!nrow(res)) {
            c("#### Spelling", "", ":white_check_mark: No misspellings.", "")
          } else {
            print(res)
            c(
              "#### Spelling",
              "",
              sprintf(
                ":warning: %d word(s) not in the dictionary or inst/WORDLIST.",
                nrow(res)
              ),
              "",
              paste0(
                "- `", res$word, "` -- ",
                vapply(res$found, function(x) paste(x, collapse = ", "), character(1L))
              ),
              ""
            )
          }

          write(md, file = part, append = TRUE)
          write(md, file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)

      - name: Check URLs
        if: always()
        shell: Rscript {0}
        env:
          PART: ${{ runner.temp }}/parts/30-soft.md
        run: |
          part <- Sys.getenv("PART")
          dir.create(dirname(part), recursive = TRUE, showWarnings = FALSE)

          res <- tryCatch(
            urlchecker::url_check("."),
            error = function(e) conditionMessage(e)
          )

          md <- if (is.character(res)) {
            c(
              "#### URLs",
              "",
              paste0(":warning: The URL check could not run: ", res),
              ""
            )
          } else if (!nrow(res)) {
            c("#### URLs", "", ":white_check_mark: All URLs resolve.", "")
          } else {
            print(res)
            cols <- intersect(c("URL", "From", "Status", "Message"), names(res))
            c(
              "#### URLs",
              "",
              sprintf(":warning: %d URL(s) worth a look.", nrow(res)),
              "",
              paste0("| ", paste(cols, collapse = " | "), " |"),
              paste0("| ", paste(rep("---", length(cols)), collapse = " | "), " |"),
              apply(res[cols], 1L, function(row) {
                paste0("| ", paste(trimws(as.character(row)), collapse = " | "), " |")
              }),
              ""
            )
          }

          write(md, file = part, append = TRUE)
          write(md, file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)

      # Setting `error_on = "never"` keeps a NOTE from failing the step,
      # and the tryCatch keeps a build that dies outright from doing so
      # either: this job reports, and reporting "the check did not run"
      # is a result rather than a reason to redden the pull request.
      - name: Report R CMD check --as-cran notes
        if: always()
        shell: Rscript {0}
        env:
          PART: ${{ runner.temp }}/parts/30-soft.md
          _R_CHECK_CRAN_INCOMING_: 'true'
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'true'
        run: |
          part <- Sys.getenv("PART")
          dir.create(dirname(part), recursive = TRUE, showWarnings = FALSE)

          res <- tryCatch(
            rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--as-cran", "--run-donttest"),
              error_on = "never",
              quiet = FALSE
            ),
            error = function(e) conditionMessage(e)
          )

          block <- function(title, items) {
            if (!length(items)) {
              return(character())
            }
            c(
              sprintf("**%s**", title),
              "",
              unlist(lapply(items, function(x) c("```", strsplit(x, "\n")[[1]], "```", "")))
            )
          }

          md <- if (is.character(res)) {
            c(
              "#### R CMD check --as-cran",
              "",
              paste0(":warning: The check could not run: ", res),
              ""
            )
          } else {
            found <- length(res$errors) + length(res$warnings) + length(res$notes)
            c(
              "#### R CMD check --as-cran",
              "",
              if (found) {
                sprintf(
                  ":warning: %d finding(s) from the CRAN incoming checks.",
                  found
                )
              } else {
                ":white_check_mark: No errors, warnings or notes."
              },
              "",
              block("Errors", res$errors),
              block("Warnings", res$warnings),
              block("Notes", res$notes)
            )
          }

          write(md, file = part, append = TRUE)
          write(md, file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)

      - name: Upload soft summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-part-soft
          path: ${{ runner.temp }}/parts/
          if-no-files-found: warn

  # ── Aggregate the hard gates for the required-checks list ───────────
  #
  # Same job as `check-all` and `release-all` elsewhere in this repo, for
  # the same reason: required_status_checks names this one row, so adding
  # a gate later does not mean editing branch protection in every
  # consumer repository.  Treats `skipped` — no label, or a merge_group
  # ref — as success.  The `soft` job is deliberately absent.

  release-gate-all:

    needs: [gate, docs]
    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Aggregate the hard gates
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          echo "gate job result:   $GATE_RESULT"
          echo "docs job result: $DOCS_RESULT"
          for result in "$GATE_RESULT" "$DOCS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # ── One sticky comment, rewritten per push ──────────────────────────
  #
  # Rewritten rather than appended so the comment always describes the
  # head commit; a thread of per-push comments is a thread nobody reads
  # to the end of.  Runs on failure too — a red gate is exactly when the
  # detail is worth having.

  report:

    needs: [gate, docs, soft]

    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Collect the job summaries
        id: parts
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: release-gate-part-*
          merge-multiple: true
          path: parts

      - name: Compose the comment
        shell: bash
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SOFT_RESULT: ${{ needs.soft.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          short="${HEAD_SHA:0:7}"

          if [ "$GATE_RESULT" = success ] && [ "$DOCS_RESULT" = success ]; then
            headline=":white_check_mark: **The hard gates pass at this commit.**"
          else
            headline=":x: **A hard gate fails at this commit.**"
          fi

          {
            echo "<!-- release-gate -->"
            echo "## Release gate — [\`$short\`]($REPO_URL/commit/$HEAD_SHA)"
            echo
            echo "$headline"
            echo

            if ls parts/*.md >/dev/null 2>&1; then
              cat parts/*.md
            else
              echo "_No check output was produced; see the job logs._"
              echo
            fi

            if [ "$SOFT_RESULT" != success ]; then
              echo ":warning: The soft-check job did not finish, so the section above may be incomplete."
              echo
            fi

            echo "---"
            echo
            echo "Reverse dependencies are checked by \`recheck\` in the \`release\` workflow, which runs on its own clock — read it in [the checks for this commit]($REPO_URL/pull/${{ github.event.pull_request.number }}/checks?sha=$HEAD_SHA)."
            echo
            echo "<sub>Rewritten by \`release-gate\` on every push, so this always describes the head commit.</sub>"
          } > comment.md

          echo "Composed $(wc -l < comment.md) lines."

      # Written with `gh api` rather than a third-party sticky-comment
      # action: this workflow is called by every repository in the fleet,
      # so a marker grep and one PATCH is a better trade than another
      # supply-chain edge.  A missing `pull-requests: write` — the
      # default on a fork pull request, whatever the caller declares —
      # warns instead of failing, since the same content is already in
      # each job's step summary.
      - name: Write the sticky comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- release-gate -->"

          # The `--paginate` flag applies the filter per page, so a
          # match on page two arrives as a second line, and `head -n1`
          # keeps the oldest
          # marked comment as the one true sticky. A null body -- which
          # a hidden comment can have -- would abort the filter, hence
          # the `// ""`.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq "map(select((.body // \"\") | startswith(\"$marker\"))) | .[0].id // empty" \
            2>/dev/null | head -n1 || true)"

          if [ -n "$existing" ]; then
            method=PATCH
            endpoint="repos/$GITHUB_REPOSITORY/issues/comments/$existing"
          else
            method=POST
            endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          fi

          if jq -n --rawfile body comment.md '{body: $body}' \
               | gh api --method "$method" "$endpoint" --input - >/dev/null; then
            echo "Comment written ($method)."
          else
            echo "::warning::release-gate: could not write the summary comment. Grant the caller 'pull-requests: write' — on a fork pull request the token is read-only regardless, and the same detail is in each job's step summary."
          fi
